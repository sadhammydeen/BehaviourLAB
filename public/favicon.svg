<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="coinGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fcd34d;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fde68a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="256" height="256" fill="url(#bgGrad)"/>
  
  <!-- Clouds left -->
  <ellipse cx="30" cy="50" rx="20" ry="15" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="50" cy="55" rx="25" ry="12" fill="#ffffff" opacity="0.7"/>
  
  <!-- Clouds right -->
  <ellipse cx="230" cy="200" rx="22" ry="14" fill="#ffffff" opacity="0.75"/>
  <ellipse cx="210" cy="210" rx="28" ry="13" fill="#ffffff" opacity="0.7"/>
  
  <!-- Large coin outer ring -->
  <circle cx="128" cy="160" r="85" fill="url(#coinGold)" stroke="#d97706" stroke-width="2"/>
  <circle cx="128" cy="160" r="80" fill="url(#coinGold)"/>
  
  <!-- Coin inner circle -->
  <circle cx="128" cy="160" r="70" fill="#fcd34d" stroke="#f59e0b" stroke-width="1.5"/>
  
  <!-- Dollar sign -->
  <text x="128" y="175" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="#d97706" text-anchor="middle" opacity="0.8">$</text>
  
  <!-- Sparkles on coin -->
  <circle cx="90" cy="140" r="4" fill="#ffffff"/>
  <line x1="85" y1="140" x2="95" y2="140" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  <line x1="90" y1="135" x2="90" y2="145" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  
  <circle cx="170" cy="190" r="3.5" fill="#ffffff"/>
  <line x1="166" y1="190" x2="174" y2="190" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  <line x1="170" y1="186" x2="170" y2="194" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Person body - dark pants -->
  <ellipse cx="128" cy="110" rx="18" ry="22" fill="#1a1a2e"/>
  
  <!-- Person body - blue jacket -->
  <path d="M 115 85 Q 110 95 115 115 L 141 115 Q 146 95 141 85 Q 135 78 128 78 Q 121 78 115 85" fill="#1e40af"/>
  
  <!-- Yellow tie/accent -->
  <rect x="124" y="85" width="8" height="18" fill="#fbbf24" rx="2"/>
  
  <!-- Person head -->
  <circle cx="128" cy="65" r="12" fill="#d4a574"/>
  
  <!-- Hair -->
  <path d="M 118 58 Q 128 48 138 58 Q 138 65 135 70 L 121 70 Q 118 65 118 58" fill="#1a1a2e"/>
  
  <!-- Arms stretched out -->
  <line x1="115" y1="95" x2="75" y2="85" stroke="#d4a574" stroke-width="6" stroke-linecap="round"/>
  <line x1="141" y1="95" x2="181" y2="85" stroke="#d4a574" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Hands -->
  <circle cx="75" cy="85" r="5" fill="#d4a574"/>
  <circle cx="181" cy="85" r="5" fill="#d4a574"/>
  
  <!-- Light glow around head -->
  <circle cx="128" cy="60" r="18" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.4" stroke-dasharray="3,3"/>
  
  <!-- Sparkles above head -->
  <line x1="128" y1="35" x2="128" y2="42" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <line x1="110" y1="45" x2="115" y2="50" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <line x1="146" y1="45" x2="141" y2="50" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
</svg>