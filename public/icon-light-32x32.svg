<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="coinGoldLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fcd34d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Light background -->
  <rect width="32" height="32" fill="#fef3c7"/>
  
  <!-- Coin -->
  <circle cx="16" cy="20" r="10" fill="url(#coinGoldLight)" stroke="#b45f06" stroke-width="0.5"/>
  
  <!-- Dollar sign inside coin -->
  <text x="16" y="22" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#8b4513" text-anchor="middle">$</text>
  
  <!-- Person simplified -->
  <circle cx="16" cy="8" r="2" fill="#d4a574"/>
  <rect x="14.5" y="10" width="3" height="4" fill="#1e40af" rx="0.5"/>
  <line x1="14.5" y1="11" x2="10" y2="9" stroke="#d4a574" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="17.5" y1="11" x2="22" y2="9" stroke="#d4a574" stroke-width="0.8" stroke-linecap="round"/>
  
  <!-- Sparkle -->
  <circle cx="17" cy="6" r="0.5" fill="#fbbf24"/>
</svg>